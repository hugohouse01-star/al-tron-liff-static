<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>鋁創請假</title>
<!--
  hrm-attendance LIFF (static, Netlify hosted)
  Phase 1.11y.11 — full i18n + file upload + proof modal
  - GAS RPC endpoint: GAS_URL?api=liff
  - LIFF endpoint URL (LINE Developers Console): this page's URL
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 14px; background: #f7f8fa; color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 16px 14px 80px; }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; background: white;
    border-bottom: 1px solid #e6e8eb; margin: -16px -14px 12px;
  }
  .topbar .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #06C755; color: white; display: flex;
    align-items: center; justify-content: center; font-weight: 600;
  }
  .topbar .who { flex: 1; font-size: 13px; line-height: 1.3; min-width: 0; }
  .topbar .who .name { font-weight: 600; }
  .topbar .who .id { color: #888; font-size: 11px; }
  .topbar select.lang {
    border: 1px solid #d0d3d8; border-radius: 5px;
    background: white; padding: 4px 6px; font-size: 12px;
  }
  .topbar button.logout {
    padding: 6px 10px; font-size: 12px; border-radius: 5px;
    background: white; color: #555; border: 1px solid #d0d3d8;
  }
  .tabs {
    /* v1.0.14 Phase B-3：改 flex 讓 4 個 tab 出現時自動 reflow */
    display: flex; gap: 4px; margin-bottom: 14px;
  }
  .tabs button {
    flex: 1; min-width: 0;
    padding: 8px 4px; border: 1px solid #e0e3e7;
    background: white; border-radius: 6px;
    font-size: 13px; cursor: pointer; color: #555;
    white-space: nowrap; text-overflow: ellipsis; overflow: hidden;
  }
  .tabs button.active {
    background: #06C755; color: white; border-color: #06C755; font-weight: 600;
  }
  .pane { display: none; }
  .pane.active { display: block; }
  .card {
    background: white; border-radius: 8px; padding: 14px;
    margin-bottom: 10px; border: 1px solid #e6e8eb;
  }
  .field { margin-bottom: 10px; }
  .field label {
    display: block; font-size: 12px; color: #666; margin-bottom: 4px;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 10px; font-size: 14px;
    border: 1px solid #d0d3d8; border-radius: 5px;
    background: white; font-family: inherit;
  }
  .field textarea { min-height: 56px; resize: vertical; }
  .btn {
    width: 100%; padding: 11px; font-size: 15px; font-weight: 600;
    border: none; border-radius: 6px; cursor: pointer;
  }
  .btn-primary { background: #06C755; color: white; }
  .btn-primary:disabled { background: #b5e3c5; }
  .btn-secondary { background: white; color: #555; border: 1px solid #d0d3d8; }
  .alert {
    padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px;
  }
  .alert-info { background: #e7f3fe; color: #0066cc; }
  .alert-warning { background: #fff7e6; color: #b97b00; }
  .alert-danger { background: #fde8e8; color: #c82333; }
  .alert-success { background: #e8f5e9; color: #2e7d32; }
  .empty { text-align: center; padding: 32px 16px; color: #999; font-size: 13px; }
  .hidden { display: none !important; }
  /* v1.0.6 Phase B-1: 今日打卡狀態 chip */
  .today-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; margin: 0 0 12px 0;
    border-radius: 8px; font-size: 13px; font-weight: 600;
    border: 1px solid transparent; line-height: 1.3;
  }
  .today-chip .chip-icon { font-size: 16px; }
  .today-chip .chip-msg { flex: 1; min-width: 0; }
  .today-chip .chip-sub { font-weight: 400; font-size: 11px; opacity: 0.75; margin-left: 6px; white-space: nowrap; }
  .today-chip.chip-ok      { background: #E8F5E9; color: #1B5E20; border-color: #c8e6c9; }
  .today-chip.chip-warn    { background: #FFF7E6; color: #854F0B; border-color: #ffe0b2; }
  .today-chip.chip-leave   { background: #FBEAF0; color: #4B1528; border-color: #f5c1d2; }
  .today-chip.chip-holiday { background: #F5F5F5; color: #555;    border-color: #e0e0e0; }
  .today-chip.chip-muted   { background: #FAFAFA; color: #777;    border-color: #ececec; }
  .today-chip.chip-loading { background: #f3f6fa; color: #555;    border-color: #e0e3e7; font-weight: 400; }
  /* Modal */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
  }
  .modal {
    background: white; border-radius: 10px; padding: 16px;
    max-width: 380px; width: 100%; max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { font-size: 16px; margin-bottom: 12px; }
  .modal .btn-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;
  }
</style>
</head>
<body>
<div class="app">

  <!-- 頂部：人員 + 語系 + 三 tab -->
  <div class="topbar">
    <div class="avatar" id="avatar">?</div>
    <div class="who">
      <div class="name" id="whoName" data-i18n="app.loadingName">載入中…</div>
      <div class="id" id="whoId"></div>
    </div>
    <select class="lang" id="langSelect" onchange="changeLang(this.value)">
      <option value="zh-TW">繁中</option>
      <option value="en">EN</option>
      <option value="th">ไทย</option>
    </select>
    <button class="logout" onclick="onLogout()" data-i18n="app.logout">登出</button>
  </div>

  <!-- 認證中 -->
  <div id="loadingPane" class="alert alert-info">
    <span data-i18n="app.loading">🔄 正在驗證 LINE 身份…</span>
    <div id="dbgLog" style="display:none;font-family:monospace;font-size:11px;color:#555;margin-top:8px;white-space:pre-wrap;line-height:1.5;"></div>
  </div>

  <!-- 首次綁定 -->
  <div id="bindPane" class="hidden">
    <div class="alert alert-warning">
      <strong data-i18n="bind.firstTime">第一次使用？</strong><br>
      <span data-i18n="bind.note">請輸入你的員工編號，幫你綁定 LINE 帳號。之後就不用再輸入。</span>
    </div>
    <div class="card">
      <div class="field">
        <label data-i18n="bind.empId">員工編號</label>
        <input type="text" id="bindEmpId" placeholder="HUGO" autocapitalize="characters">
      </div>
      <button class="btn btn-primary" onclick="onBind(this)" data-i18n="bind.submit">綁定</button>
    </div>
  </div>

  <!-- v1.0.88: HRM_NOT_OPEN_YET gate — Portal 沒給 hrm-attendance 權限 -->
  <div id="gatePane" class="hidden">
    <div class="alert alert-warning" style="text-align:center;padding:24px;">
      <div style="font-size:48px;margin-bottom:12px;">🔒</div>
      <strong data-i18n="gate.title" style="font-size:18px;display:block;margin-bottom:8px;">考勤系統測試中</strong>
      <span data-i18n="gate.body">目前未開放您使用考勤系統。如有疑問請聯絡管理員。</span>
    </div>
  </div>

  <!-- 認證失敗 -->
  <div id="errorPane" class="hidden alert alert-danger"></div>

  <!-- 主功能 -->
  <div id="mainPane" class="hidden">
    <!-- v1.0.6 Phase B-1: 今日打卡狀態 chip — auth 後背景 fire monthlyAttendance 取得 -->
    <div id="todayChip" class="today-chip chip-loading">
      <span class="chip-icon">⏳</span>
      <span class="chip-msg" data-i18n="chip.loading">載入今日狀態…</span>
    </div>
    <!-- v1.0.14 Phase B-3：4 個 tab。「待簽」smart-show — count>0 才顯示 -->
    <div class="tabs" id="tabsRow">
      <button id="tabBtnApply" class="active" onclick="switchTab('apply')">📝 <span data-i18n="apply.tab">請假</span></button>
      <button id="tabBtnHistory" onclick="switchTab('history')">📋 <span data-i18n="history.tab">歷程</span></button>
      <button id="tabBtnCalendar" onclick="switchTab('calendar')">📅 <span data-i18n="cal.tab">月曆</span></button>
      <button id="tabBtnPending" class="hidden" onclick="switchTab('pending')">📨 <span data-i18n="pending.tab">待簽</span><span id="pendingBadge" style="display:none;margin-left:3px;background:#D85A30;color:white;font-size:10px;padding:1px 5px;border-radius:8px;font-weight:600;"></span></button>
    </div>

    <!-- 請假 -->
    <div id="paneApply" class="pane active">
      <div id="applyFormLoading" class="alert alert-info" data-i18n="apply.loadingTypes">⏳ 載入假別清單…</div>
      <div id="applyFormContainer" class="hidden">
        <!-- Card 1: 基本 -->
        <div class="card">
          <div class="field">
            <label data-i18n="apply.leaveType">假別</label>
            <select id="appLeaveId" onchange="updateQuotaInfo(); updateExtraFields();"></select>
            <div id="appQuotaInfo" style="font-size:11px;color:#666;margin-top:4px;"></div>
          </div>
          <div class="field" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div>
              <label data-i18n="apply.startDate">起始日期</label>
              <input type="date" id="appStartDate" onchange="onStartDateChanged()">
            </div>
            <div>
              <label data-i18n="apply.endDate">結束日期</label>
              <input type="date" id="appEndDate">
            </div>
          </div>
          <div class="field">
            <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#222;">
              <input type="checkbox" id="appFullDay" checked onchange="onFullDayToggle()">
              <span><strong data-i18n="apply.fullDay">全天</strong><span data-i18n="apply.fullDayNote">（依當日排班計算工時）</span></span>
            </label>
          </div>
          <div id="appTimeRange" class="field hidden" style="grid-template-columns:1fr 1fr;gap:8px;">
            <div>
              <label data-i18n="apply.startTime">起始時間</label>
              <input type="time" id="appStartTime" value="08:00">
            </div>
            <div>
              <label data-i18n="apply.endTime">結束時間</label>
              <input type="time" id="appEndTime" value="17:00">
            </div>
          </div>
        </div>

        <!-- Card 2: 補充欄位 -->
        <div class="card hidden" id="appExtraCard">
          <div style="font-weight:600;font-size:13px;color:#b97b00;margin-bottom:8px;" data-i18n="apply.extraTitle">📋 補充資訊</div>
          <div class="field hidden" id="appEventDateGroup">
            <label data-i18n="apply.eventDate">事件日</label>
            <input type="date" id="appEventDate">
            <div style="font-size:11px;color:#888;margin-top:3px;" data-i18n="apply.eventDateHint">婚禮/喪事/預產期/配偶生產日/流產日/產檢日</div>
          </div>
          <div class="field hidden" id="appPregnancyStageGroup">
            <label data-i18n="apply.pregnancyStage">妊娠週期</label>
            <select id="appPregnancyStage">
              <option value="3m_plus" data-i18n="apply.preg.3m">≥ 3 個月（流產假 28 天）</option>
              <option value="2_3m" data-i18n="apply.preg.2_3m">2 ~ 3 個月（流產假 7 天）</option>
              <option value="lt_2m" data-i18n="apply.preg.lt2m">&lt; 2 個月（流產假 5 天）</option>
            </select>
          </div>
          <div class="field hidden" id="appRelationGroup">
            <label data-i18n="apply.relation">親屬關係</label>
            <select id="appRelation"></select>
          </div>
          <div class="field hidden" id="appRelNameGroup">
            <label data-i18n="apply.relativeName">親屬姓名</label>
            <input type="text" id="appRelativeName">
          </div>
        </div>

        <!-- Card 3: 原因 + 證明 + 代理人 -->
        <div class="card">
          <div class="field">
            <label data-i18n="apply.reason">請假原因</label>
            <textarea id="appReason"></textarea>
          </div>
          <div class="field">
            <label data-i18n="apply.proofFile">證明檔案（可選；拍照或選檔）</label>
            <div style="display:flex;gap:6px;">
              <button type="button" class="btn-secondary" style="flex:1;padding:8px;font-size:13px;" onclick="document.getElementById('appProofCamera').click()" data-i18n="apply.takePhoto">📷 拍照</button>
              <button type="button" class="btn-secondary" style="flex:1;padding:8px;font-size:13px;" onclick="document.getElementById('appProofFile').click()" data-i18n="apply.pickFile">📁 選檔</button>
            </div>
            <input type="file" id="appProofCamera" accept="image/*" capture="environment" style="display:none" onchange="onAppFileChosen(this)">
            <input type="file" id="appProofFile" accept="image/*,application/pdf,.doc,.docx" style="display:none" onchange="onAppFileChosen(this)">
            <div id="appProofFileName" style="font-size:11px;color:#06C755;margin-top:4px;"></div>
          </div>
          <div class="field">
            <label data-i18n="apply.proofUrl">證明連結（可選）</label>
            <input type="text" id="appProofUrl" placeholder="https://…">
          </div>
          <div class="field">
            <label data-i18n="apply.proofNote">證明說明（可選）</label>
            <textarea id="appProofNote"></textarea>
          </div>
          <div class="field">
            <label data-i18n="apply.delegates">職務代理人（最多 3 位）</label>
            <select id="appDelegate1" style="margin-bottom:4px;"><option value="" data-i18n="apply.notSpecified">— 不指定 —</option></select>
            <select id="appDelegate2" style="margin-bottom:4px;"><option value="" data-i18n="apply.notSpecified">— 不指定 —</option></select>
            <select id="appDelegate3"><option value="" data-i18n="apply.notSpecified">— 不指定 —</option></select>
          </div>
          <button class="btn btn-primary" id="appSubmitBtn" onclick="onSubmitLeave(this)" data-i18n="apply.submit">送出請假</button>
        </div>
        <div id="appResult"></div>
      </div>
    </div>

    <!-- 歷程 -->
    <div id="paneHistory" class="pane">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong data-i18n="history.title">我的請假歷程</strong>
        <select id="histYear" style="padding:6px;border:1px solid #d0d3d8;border-radius:5px;font-size:13px;"></select>
      </div>
      <div id="histContainer" class="empty" data-i18n="app.loadingShort">載入中…</div>
    </div>

    <!-- 月曆 -->
    <div id="paneCalendar" class="pane">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <button onclick="changeMonth(-1)" style="padding:6px 12px;border:1px solid #d0d3d8;background:white;border-radius:5px;font-size:13px;cursor:pointer;">‹</button>
        <strong id="calMonthLabel">— —</strong>
        <button onclick="changeMonth(1)" style="padding:6px 12px;border:1px solid #d0d3d8;background:white;border-radius:5px;font-size:13px;cursor:pointer;">›</button>
      </div>
      <div id="calContainer" class="empty" data-i18n="app.loadingShort">載入中…</div>
    </div>

    <!-- v1.0.14 Phase B-3: 待簽 tab —— 主簽核 + 證明覆核 合在一起 -->
    <div id="panePending" class="pane">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong data-i18n="pending.title">待我簽核</strong>
        <button onclick="loadPendingTab(true)" style="padding:4px 10px;border:1px solid #d0d3d8;background:white;border-radius:5px;font-size:12px;cursor:pointer;color:#555;">↻ <span data-i18n="pending.refresh">重新整理</span></button>
      </div>
      <div id="pendingContainer" class="empty" data-i18n="app.loadingShort">載入中…</div>
    </div>
  </div>

</div>

<!-- v1.0.14 Phase B-3：拒絕簽核 / 拒絕證明 modal（共用） -->
<div id="rejectModal" class="modal-mask hidden">
  <div class="modal">
    <h3 id="rejectModalTitle" data-i18n="reject.title">📋 填寫拒絕理由</h3>
    <div class="field">
      <label data-i18n="reject.reasonLabel">理由（必填）</label>
      <textarea id="rejectModalNote" style="min-height:80px;"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeRejectModal()" data-i18n="reject.cancel">取消</button>
      <button class="btn btn-primary" onclick="submitRejectModal(this)" data-i18n="reject.submit">送出</button>
    </div>
  </div>
</div>

<!-- 補證明 modal -->
<div id="proofModal" class="modal-mask hidden">
  <div class="modal">
    <h3 data-i18n="proof.title">📎 補證明</h3>
    <div class="field">
      <label data-i18n="proof.fileLabel">檔案（可選）</label>
      <div style="display:flex;gap:6px;">
        <button type="button" class="btn-secondary" style="flex:1;padding:8px;font-size:13px;" onclick="document.getElementById('proofModalCamera').click()" data-i18n="apply.takePhoto">📷 拍照</button>
        <button type="button" class="btn-secondary" style="flex:1;padding:8px;font-size:13px;" onclick="document.getElementById('proofModalFile').click()" data-i18n="apply.pickFile">📁 選檔</button>
      </div>
      <input type="file" id="proofModalCamera" accept="image/*" capture="environment" style="display:none" onchange="onProofModalFileChosen(this)">
      <input type="file" id="proofModalFile" accept="image/*,application/pdf,.doc,.docx" style="display:none" onchange="onProofModalFileChosen(this)">
      <div id="proofModalFileName" style="font-size:11px;color:#06C755;margin-top:4px;"></div>
    </div>
    <div class="field">
      <label data-i18n="proof.urlLabel">連結（可選）</label>
      <input type="text" id="proofModalUrl" placeholder="https://…">
    </div>
    <div class="field">
      <label data-i18n="proof.noteLabel">說明（可選）</label>
      <textarea id="proofModalNote"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeProofModal()" data-i18n="proof.cancel">取消</button>
      <button class="btn btn-primary" onclick="submitProofModal(this)" data-i18n="proof.submit">送出</button>
    </div>
  </div>
</div>

<!-- LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// === 配置 =============================================================
var LIFF_ID = '2010088139-PM556AZ4';
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzbCn4L5zHXZREPRqS1Yq07NxX3iYHocuOVIpKc7gVcP6my8jLE8yMkA3tWWUG7qgobQA/exec';
var APP_VERSION = 'static-1.0.14';
// ======================================================================

// 1.11y.24：warmup ping — 在 LIFF SDK init 同時觸發 GAS 預熱
// LIFF init 約需 1 秒做 LINE handshake，那段時間 GAS 沒事做就先 ping
// 等 idToken 拿到打 exchangeToken 時，GAS 應該已經 warm
// 不需 idToken（liff.js _handleLiffApiRoute_ 的 'ping' action 跳過 auth）
(function _warmupGas() {
  try {
    fetch(GAS_URL + '?api=liff', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'ping' })
    }).catch(function() {});
  } catch (e) {}
})();

var SESSION = null;

// === i18n ============================================================
var I18N_DICTS = {
  'zh-TW': {
    'app.loadingName': '載入中…', 'app.loading': '🔄 正在驗證 LINE 身份…',
    'app.loadingShort': '載入中…', 'app.logout': '登出', 'app.lang': '語言',
    'app.role.superadmin': '超級管理員', 'app.role.admin': '系統管理員',
    'app.role.manager': '主管', 'app.role.user': '一般使用者', 'app.role.employee': '員工',
    'bind.firstTime': '第一次使用？', 'bind.note': '請輸入你的鋁創系統帳號（不是考勤機的員工編號），幫你綁定 LINE。之後就不用再輸入。',
    'bind.empId': '鋁創系統帳號', 'bind.submit': '綁定', 'bind.submitting': '綁定中…',
    'apply.tab': '請假', 'apply.loadingTypes': '⏳ 載入假別清單…',
    'apply.leaveType': '假別', 'apply.startDate': '起始日期', 'apply.endDate': '結束日期',
    'apply.fullDay': '全天', 'apply.fullDayNote': '（依當日排班計算工時）',
    'apply.startTime': '起始時間', 'apply.endTime': '結束時間',
    'apply.extraTitle': '📋 補充資訊',
    'apply.eventDate': '事件日', 'apply.eventDateHint': '婚禮/喪事/預產期/配偶生產日/流產日/產檢日',
    'apply.pregnancyStage': '妊娠週期',
    'apply.preg.3m': '≥ 3 個月（流產假 28 天）', 'apply.preg.2_3m': '2 ~ 3 個月（流產假 7 天）', 'apply.preg.lt2m': '< 2 個月（流產假 5 天）',
    'apply.relation': '親屬關係', 'apply.relativeName': '親屬姓名',

function _locName(obj, kind) {
  if (!obj) return '';
  var lang = CURRENT_LANG;
  var dbKey = (lang === 'zh-TW') ? 'nameZh' : (lang === 'en' ? 'nameEn' : 'nameTh');
  if (obj[dbKey]) return obj[dbKey];
  var id = obj.leaveId || obj.shiftId;
  var dict = (kind === 'shift') ? STD_SHIFT_NAMES : STD_LEAVE_NAMES;
  var fbKey = (lang === 'zh-TW') ? 'zh' : (lang === 'en' ? 'en' : 'th');
  if (id && dict[id]) return dict[id][fbKey];
  return obj.nameZh || id || '';
}

var CURRENT_LANG = (function() {
  try { return localStorage.getItem('liff_lang') || 'zh-TW'; } catch (e) { return 'zh-TW'; }
})();

function t(key, params) {
  var d = I18N_DICTS[CURRENT_LANG] || I18N_DICTS['zh-TW'];
  var v = d[key];
  if (v == null) v = I18N_DICTS['zh-TW'][key] || key;
  if (params) {
    for (var k in params) v = v.replace('{' + k + '}', params[k]);
  }
  return v;
}

function applyI18n() {
  var els = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < els.length; i++) {
    var key = els[i].getAttribute('data-i18n');
    els[i].textContent = t(key);
  }
}

function changeLang(lang) {
  CURRENT_LANG = lang;
  try { localStorage.setItem('liff_lang', lang); } catch (e) {}
  applyI18n();
  // 重新渲染動態內容
  if (APPLY_LEAVE_TYPES) renderApplyForm();
  if (SESSION) {
    setText('whoName', SESSION.nameZh || SESSION.employeeId);

// === RPC ==============================================================
var ACTION_MAP = {
  'webLiffExchangeToken':            { action: 'exchangeToken',     params: ['idToken'] },
  'webLiffInit':                     { action: 'init',              params: ['idToken'] },
  'webLiffBindEmployee':             { action: 'bindEmployee',      params: ['idToken', 'employeeId'] },
  'webLiffSubmitLeave':              { action: 'submitLeave',       params: ['idToken', 'leaveData'] },
  'webLiffListLeaveTypesForEmployee':{ action: 'listLeaveTypes',    params: ['idToken'] },
  'webLiffListEmployeesForDelegate': { action: 'listEmployees',     params: ['idToken'] },
  'webLiffMyLeaveHistory':           { action: 'myLeaveHistory',    params: ['idToken', 'year'] },
  'webLiffMonthlyAttendance':        { action: 'monthlyAttendance', params: ['idToken', 'yearMonth'] },
  'webLiffTodayStatus':              { action: 'todayStatus',       params: ['idToken'] },
  'webLiffApprovalBundle':           { action: 'approvalBundle',    params: ['idToken'] },
  'webLiffApproveLeave':             { action: 'approveLeave',      params: ['idToken', 'requestId', 'decision', 'note'] },
  'webLiffProofReview':              { action: 'proofReview',       params: ['idToken', 'requestId', 'decision', 'note'] },
  'webLiffUpdateProofData':          { action: 'updateProofData',   params: ['idToken', 'requestId', 'proofData'] },
  'webLiffUploadProofFile':          { action: 'uploadProofFile',   params: ['idToken', 'requestId', 'fileObj'] }
};

async function rpc(fn, args) {
  var mapping = ACTION_MAP[fn];
  if (!mapping) throw new Error('Unknown RPC: ' + fn);
  var body = { action: mapping.action };
  (args || []).forEach(function(v, i) { body[mapping.params[i]] = v; });
  var resp = await fetch(GAS_URL + '?api=liff', {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return await resp.json();
}

// === file → base64 ====================================================
function fileToBase64(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var dataUrl = e.target.result;
        var base64 = dataUrl.split(',')[1];
        resolve(base64);
      } catch (err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

window.addEventListener('DOMContentLoaded', async function() {
  // 初始 i18n + 語系下拉
  applyI18n();
  $('langSelect').value = CURRENT_LANG;

  if (!LIFF_ID) { showError(t('app.err.noLiffId')); return; }
  try {
    dbg('LIFF_ID=' + LIFF_ID); dbg('host=' + location.host);
    dbg('typeof liff=' + typeof liff);
    if (typeof liff === 'undefined') { showError(t('app.err.sdkNotLoaded')); return; }
    dbg('liff.init() start');
    await liff.init({ liffId: LIFF_ID });
    dbg('liff.init() OK');
    if (!liff.isLoggedIn()) { dbg('not logged in → liff.login()'); try { liff.login(); } catch(le){} return; }
    var idToken = liff.getIDToken();
    if (!idToken) { showError(t('app.err.noIdToken')); return; }

    // v1.0.11：從 4 RPC 改 1 RPC（webLiffInit 一發回 session + leaveTypes + todayStatus）
    // 後端 v1.0.92 給 _verifyLiffIdToken_ 加了 CacheService，init 內部三個 sub-call 只 verify 1 次
    var t0 = Date.now();
    var profilePromise = liff.getProfile();
    APPLY_LEAVE_TYPES_LOADING = true;
    var initPromise = rpc('webLiffInit', [idToken]);

    var profile = await profilePromise;
    setText('avatar', (profile.displayName || '?').substring(0, 1));
    var res = await initPromise;
    dbg('init done in ' + (Date.now() - t0) + 'ms');
    APPLY_LEAVE_TYPES_LOADING = false;

    if (!res || !res.success) {
      if (res && res.errorCode === 'BIND_NEEDED') {
        hide('loadingPane'); show('bindPane');
        setText('whoName', profile.displayName || 'LINE');
        setText('whoId', t('history.proof.pending'));
        SESSION = { idToken: idToken, displayName: profile.displayName };
        return;
      }
      // v1.0.88: Portal 沒授權 hrm-attendance → 顯示 gate
      if (res && res.errorCode === 'HRM_NOT_OPEN_YET') {
        hide('loadingPane'); show('gatePane');
        return;
      }
      showError((res && res.message) || t('app.err.authFailed'));
      return;
    }
    // v1.0.11: init payload = { session, leaveTypes, year, todayStatus }
    SESSION = res.data.session;
    SESSION.idToken = idToken;
    setText('whoName', SESSION.nameZh || SESSION.employeeId);
    // v1.0.8 修：拔掉 data-i18n，避免 renderApplyForm 末段 applyI18n 把 whoName 沖回「載入中…」
    var _wn = $('whoName'); if (_wn) _wn.removeAttribute('data-i18n');
    setText('whoId', SESSION.employeeId + '（' + t('app.role.' + (SESSION.role || 'employee')) + '）');
    hide('loadingPane'); show('mainPane');

    // chip：init 已內含 todayStatus，直接 render（不用再 fire RPC）
    if (res.data.todayStatus) {
      loadTodayChip(Promise.resolve({ success: true, data: res.data.todayStatus }));
    } else {
      loadTodayChip();  // fallback — todayStatus 沒回（後端例外時）就重 fetch
    }

    // leaveTypes：init 已含
    if (res.data.leaveTypes) {
      APPLY_LEAVE_TYPES = res.data.leaveTypes;
      renderApplyForm();
    }

    // v1.0.14 Phase B-3: approvalBundle smart-show 「待簽」tab
    if (res.data.approvalBundle) {
      applyApprovalBundle(res.data.approvalBundle);
    }

    // 萬一 leaveTypes 沒回（後端例外），顯示錯誤訊息
    if (!res.data.leaveTypes || !res.data.leaveTypes.length) {
      $('applyFormLoading').textContent = '❌ load fail';
      $('applyFormLoading').className = 'alert alert-danger';
    }

  } catch (e) {
    showError('init: ' + (e && e.message || e));
  }
});

async function onBind(btn) {
  var empId = ($('bindEmpId').value || '').trim();
  if (!empId) { alert(t('bind.empId')); return; }
  if (!SESSION || !SESSION.idToken) { alert(t('app.sessionLost')); return; }
  btn.disabled = true; btn.textContent = t('bind.submitting');
  try {
    var res = await rpc('webLiffBindEmployee', [SESSION.idToken, empId]);
    if (!res || !res.success) {
      // v1.0.88: Portal 沒授權 hrm-attendance → 顯示 gate（不寫 line_user_id）
      if (res && res.errorCode === 'HRM_NOT_OPEN_YET') {
        hide('bindPane'); show('gatePane');
        return;
      }
      alert((res && res.message) || 'fail');
      btn.disabled = false; btn.textContent = t('bind.submit'); return;
    }
    // v1.0.11: bind 完用 webLiffInit 一發拿 session + leaveTypes + todayStatus
    APPLY_LEAVE_TYPES_LOADING = true;
    var ex = await rpc('webLiffInit', [SESSION.idToken]);
    APPLY_LEAVE_TYPES_LOADING = false;
    if (!ex || !ex.success) { alert(t('app.err.bindRefetch')); return; }
    SESSION = ex.data.session;
    SESSION.idToken = (window.liff && liff.getIDToken) ? liff.getIDToken() : '';
    setText('whoName', SESSION.nameZh || SESSION.employeeId);
    var _wn = $('whoName'); if (_wn) _wn.removeAttribute('data-i18n');
    setText('whoId', SESSION.employeeId + '（' + t('app.role.' + (SESSION.role || 'employee')) + '）');
    hide('bindPane'); show('mainPane');
    if (ex.data.todayStatus) {
      loadTodayChip(Promise.resolve({ success: true, data: ex.data.todayStatus }));
    } else {
      loadTodayChip();
    }
    if (ex.data.leaveTypes) {
      APPLY_LEAVE_TYPES = ex.data.leaveTypes; renderApplyForm();
    }
    if (ex.data.approvalBundle) {
      applyApprovalBundle(ex.data.approvalBundle);
    }
  } catch (e) {
    alert('error: ' + (e && e.message || e));
    btn.disabled = false; btn.textContent = t('bind.submit');
  }
}

var REL_KEYS = ['parent','foster_parent','step_parent','spouse','grandparent','child',
                'spouse_parent','spouse_foster_parent','spouse_step_parent',
                'great_grandparent','sibling','spouse_grandparent'];

async function loadApplyTabIfNeeded() {
  if (!SESSION || !SESSION.idToken) return;
  if (APPLY_LEAVE_TYPES) return;
  if (APPLY_LEAVE_TYPES_LOADING) return;
  APPLY_LEAVE_TYPES_LOADING = true;
  try {
    var res = await rpc('webLiffListLeaveTypesForEmployee', [SESSION.idToken]);
    if (!res || !res.success) {
      $('applyFormLoading').textContent = '❌ ' + ((res && res.message) || 'fail');
      $('applyFormLoading').className = 'alert alert-danger'; return;
    }
    APPLY_LEAVE_TYPES = res.data.leaveTypes || []; renderApplyForm();
  } catch (e) {
    $('applyFormLoading').textContent = '❌ ' + (e.message || e);
    $('applyFormLoading').className = 'alert alert-danger';
  } finally { APPLY_LEAVE_TYPES_LOADING = false; }
}

function renderApplyForm() {
  // 假別 dropdown
  var sel = $('appLeaveId'); sel.innerHTML = '';
  APPLY_LEAVE_TYPES.forEach(function(lt) {
    var opt = document.createElement('option');
    opt.value = lt.leaveId;
    var showBal = (lt.showBalance !== false);
    var rem = (showBal && lt.remaining != null) ? '（' + lt.remaining + ' / ' + lt.granted + ' ' + t('app.daysUnit') + '）' : '';
    opt.textContent = _locName(lt, 'leave') + rem;
    opt.dataset.granted = lt.granted;
    opt.dataset.used = lt.used;
    opt.dataset.remaining = lt.remaining;
    opt.dataset.showBalance = String(showBal);
    sel.appendChild(opt);
  });
  // 親屬下拉
  var relSel = $('appRelation'); relSel.innerHTML = '';
  REL_KEYS.forEach(function(k) {
    var o = document.createElement('option');
    o.value = k; o.textContent = t('rel.' + k);
    relSel.appendChild(o);
  });
  // 預設日期
  var today = new Date();
  var ymd = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  if (!$('appStartDate').value) $('appStartDate').value = ymd;
  if (!$('appEndDate').value) $('appEndDate').value = ymd;
  updateQuotaInfo(); updateExtraFields();
  hide('applyFormLoading'); show('applyFormContainer');
  loadEmployeesForDelegate();
  applyI18n();
}

function updateQuotaInfo() {
  var sel = $('appLeaveId'); if (!sel.options.length) return;
  var opt = sel.options[sel.selectedIndex];
  if (opt.dataset.showBalance === 'false') { $('appQuotaInfo').textContent = ''; return; }
  $('appQuotaInfo').textContent = t('apply.quotaInfo', {
    g: opt.dataset.granted || 0, u: opt.dataset.used || 0, r: opt.dataset.remaining || 0
  });
}

function updateExtraFields() {
  var lid = $('appLeaveId').value;
  var isBer = (lid === 'bereavement'), isMis = (lid === 'miscarriage');
  var needEvent = isBer || lid==='marriage' || lid==='maternity' || lid==='paternity' || lid==='prenatal_checkup' || isMis;

async function onSubmitLeave(btn) {
  if (!SESSION || !SESSION.idToken) { alert(t('app.sessionLost')); return; }
  var leaveId = $('appLeaveId').value;
  var startDate = $('appStartDate').value;
  var endDate = $('appEndDate').value;
  var fullDay = $('appFullDay').checked;
  var startTime = fullDay ? '' : $('appStartTime').value;
  var endTime = fullDay ? '' : $('appEndTime').value;
  var reason = ($('appReason').value || '').trim();
  if (!leaveId || !startDate || !endDate) { alert(t('apply.startDate')); return; }
  if (!reason) { alert(t('apply.reason')); return; }
  if (endDate < startDate) { alert(t('apply.startDate')); return; }
  var eventDate = $('appEventDate') ? $('appEventDate').value : '';
  var pregnancyStage = $('appPregnancyStage') ? $('appPregnancyStage').value : '';
  var relation = $('appRelation') ? $('appRelation').value : '';
  var relativeName = $('appRelativeName') ? ($('appRelativeName').value || '').trim() : '';
  var proofUrl = $('appProofUrl') ? ($('appProofUrl').value || '').trim() : '';
  var proofNote = $('appProofNote') ? ($('appProofNote').value || '').trim() : '';
  var proofFile = APP_SELECTED_FILE; // 拍照或選檔都寫進這個
  var d1 = $('appDelegate1') ? $('appDelegate1').value : '';
  var d2 = $('appDelegate2') ? $('appDelegate2').value : '';
  var d3 = $('appDelegate3') ? $('appDelegate3').value : '';
  var delegates = [d1, d2, d3].filter(function(x){ return x; }).join(',');
  if (leaveId === 'bereavement') {
    if (!relation) { alert(t('apply.relation')); return; }
    if (!relativeName) { alert(t('apply.relativeName')); return; }
  }
  if (['bereavement','marriage','maternity','paternity','prenatal_checkup','miscarriage'].indexOf(leaveId) >= 0) {
    if (!eventDate) { alert(t('apply.eventDate')); return; }
  }
  var proofData = {};
  if (proofUrl) proofData.link = proofUrl;
  if (proofNote) proofData.note = proofNote;

  btn.disabled = true; btn.textContent = t('apply.submitting');
  var resBox = $('appResult'); resBox.innerHTML = '';
  try {
    var res = await rpc('webLiffSubmitLeave', [SESSION.idToken, {
      leaveId: leaveId, startDate: startDate, startTime: startTime,
      endDate: endDate, endTime: endTime, reason: reason,
      proofUrl: proofUrl, proofData: proofData, delegates: delegates,
      relation: (leaveId === 'bereavement') ? relation : '',
      relativeName: (leaveId === 'bereavement') ? relativeName : '',
      eventDate: (['bereavement','marriage','maternity','paternity','prenatal_checkup','miscarriage'].indexOf(leaveId) >= 0) ? eventDate : '',
      pregnancyStage: (leaveId === 'miscarriage') ? pregnancyStage : ''
    }]);
    btn.disabled = false; btn.textContent = t('apply.submit');
    if (!res || !res.success) {
      resBox.innerHTML = '<div class="alert alert-danger">❌ ' + ((res && res.message) || 'fail') + '</div>'; return;
    }
    var d = res.data;
    var msg = t('apply.success') + d.requestId + '<br>' + t('apply.successHours') + d.hoursTotal;
    resBox.innerHTML = '<div class="alert alert-success">' + msg + '</div>';

    // 有檔案 → 上傳
    if (proofFile) {
      try {
        var b64 = await fileToBase64(proofFile);
        var upRes = await rpc('webLiffUploadProofFile', [SESSION.idToken, d.requestId, {
          base64: b64, fileName: proofFile.name, mimeType: proofFile.type || 'application/octet-stream'
        }]);
        if (upRes && upRes.success) {
          // 把 fileId/Url merge 進 proofData，更新 proof_data_json
          var merged = Object.assign({}, proofData, {
            fileId: upRes.data.fileId, fileUrl: upRes.data.fileUrl, fileName: upRes.data.fileName
          });
          await rpc('webLiffUpdateProofData', [SESSION.idToken, d.requestId, merged]);
        } else {
          resBox.innerHTML += '<div class="alert alert-warning">' + t('apply.uploadFail') + '</div>';
        }
      } catch (upErr) {
        resBox.innerHTML += '<div class="alert alert-warning">' + t('apply.uploadFail') + ' (' + upErr.message + ')</div>';
      }
    }

    // reset form
    $('appReason').value = ''; $('appProofUrl').value = ''; $('appProofNote').value = '';
    if ($('appProofFile')) $('appProofFile').value = '';
    if ($('appProofCamera')) $('appProofCamera').value = '';
    APP_SELECTED_FILE = null;
    if ($('appProofFileName')) $('appProofFileName').textContent = '';
    APPLY_LEAVE_TYPES = null;
    setTimeout(loadApplyTabIfNeeded, 500);
  } catch (e) {
    btn.disabled = false; btn.textContent = t('apply.submit');
    resBox.innerHTML = '<div class="alert alert-danger">❌ ' + (e.message || e) + '</div>';
  }
}

// === history ==========================================================
var HIST_YEAR_INITED = false;
async function loadHistoryTab(forceYear) {
  if (!SESSION || !SESSION.idToken) return;
  if (!HIST_YEAR_INITED) {
    var sel = $('histYear');
    var thisYear = new Date().getFullYear();
    for (var y = thisYear; y >= thisYear - 4; y--) {
      var opt = document.createElement('option');
      opt.value = y; opt.textContent = y + ' ' + t('history.year');
      sel.appendChild(opt);
    }
    sel.onchange = function() { loadHistoryTab(Number(this.value)); };
    HIST_YEAR_INITED = true;
  }
  var year = forceYear || Number($('histYear').value);
  $('histContainer').className = 'empty';
  $('histContainer').textContent = t('app.loadingShort');
  try {
    var res = await rpc('webLiffMyLeaveHistory', [SESSION.idToken, year]);
    if (!res || !res.success) {
      $('histContainer').innerHTML = '<div class="alert alert-danger">' + ((res && res.message) || 'fail') + '</div>';
      $('histContainer').className = ''; return;
    }
    window._lastHistRequests = res.data.requests || [];
    renderHistory(window._lastHistRequests);
  } catch (e) {
    $('histContainer').innerHTML = '<div class="alert alert-danger">' + (e.message || e) + '</div>';
    $('histContainer').className = '';
  }
}

function renderHistory(requests) {
  var box = $('histContainer'); box.className = '';
  if (!requests.length) { box.innerHTML = '<div class="empty">' + t('history.empty') + '</div>'; return; }
  var html = '';
  requests.forEach(function(r) {
    var statusColor, statusText;
    if (r.status === 'approved') { statusColor = '#2e7d32'; statusText = t('history.status.approved'); }
    else if (r.status === 'rejected') { statusColor = '#c82333'; statusText = t('history.status.rejected'); }
    else if (r.status === 'cancelled') { statusColor = '#888'; statusText = t('history.status.cancelled'); }
    else { statusColor = '#f57c00'; statusText = t('history.status.pending'); }
    var subBadge = '';
    var needProof = (r.proofStatus === 'pending_proof' || r.proofStatus === 'rejected_at_review');
    if (r.status === 'approved' && r.proofStatus) {
      if (r.proofStatus === 'pending_proof') subBadge = '<div style="font-size:11px;color:#ff9800;">' + t('history.proof.pending') + '</div>';
      else if (r.proofStatus === 'submitted') subBadge = '<div style="font-size:11px;color:#2196f3;">' + t('history.proof.submitted') + '</div>';
      else if (r.proofStatus === 'verified') subBadge = '<div style="font-size:11px;color:#4caf50;">' + t('history.proof.verified') + '</div>';
      else if (r.proofStatus === 'rejected_at_review') subBadge = '<div style="font-size:11px;color:#f44336;">' + t('history.proof.rejected') + '</div>';
    }
    if (needProof) {
      subBadge += '<button onclick="openProofModal(\'' + r.requestId + '\')" style="margin-top:6px;padding:6px 10px;font-size:12px;border:1px solid #06C755;background:white;color:#06C755;border-radius:5px;cursor:pointer;">' + t('history.addProof') + '</button>';
    }
    html += '<div class="card" style="margin-bottom:8px;padding:10px;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">';
    html += '<div><strong style="font-size:14px;">' + _locName({leaveId: r.leaveId}, 'leave') + '</strong><span style="font-size:11px;color:#888;margin-left:6px;">' + r.hoursTotal + ' ' + t('app.hoursUnit') + '</span></div>';
    html += '<div style="color:' + statusColor + ';font-weight:600;font-size:13px;">' + statusText + '</div>';
    html += '</div>';
    html += '<div style="font-size:12px;color:#555;">' + r.startDate + (r.startTime ? ' ' + r.startTime : '') + ' ~ ' + r.endDate + (r.endTime ? ' ' + r.endTime : '') + '</div>';
    if (r.reason) html += '<div style="font-size:11px;color:#666;margin-top:4px;">' + t('apply.reason') + '：' + escapeHtml(r.reason) + '</div>';
    html += subBadge;
    html += '</div>';
  });
  box.innerHTML = html;
}
function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// === calendar =========================================================
var CAL_YM = null;
function changeMonth(delta) {
  if (!CAL_YM) return;
  var parts = CAL_YM.split('-');
  var d = new Date(Number(parts[0]), Number(parts[1]) - 1 + delta, 1);
  CAL_YM = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  loadCalendarTab(CAL_YM);
}
async function loadCalendarTab(yearMonth) {
  if (!SESSION || !SESSION.idToken) return;
  if (!CAL_YM) { var now = new Date(); CAL_YM = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0'); }
  if (yearMonth) CAL_YM = yearMonth;
  setText('calMonthLabel', CAL_YM);
  // v1.0.6 Phase B-1: 同月 cache 命中直接渲（chip 啟動時已 fetch 當月）
  if (window._calCache && window._calCache[CAL_YM]) {
    renderCalendar(window._calCache[CAL_YM]);
    return;
  }
  $('calContainer').className = 'empty';
  $('calContainer').textContent = t('app.loadingShort');
  try {
    var res = await rpc('webLiffMonthlyAttendance', [SESSION.idToken, CAL_YM]);
    if (!res || !res.success) {
      $('calContainer').innerHTML = '<div class="alert alert-danger">' + ((res && res.message) || 'fail') + '</div>';
      $('calContainer').className = ''; return;
    }
    if (!window._calCache) window._calCache = {};
    window._calCache[CAL_YM] = res.data;
    renderCalendar(res.data);
  } catch (e) {
    $('calContainer').innerHTML = '<div class="alert alert-danger">' + (e.message || e) + '</div>';
    $('calContainer').className = '';
  }
}
