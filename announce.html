<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>公告確認 AL-TRON</title>
<!--
  AL-TRON 公告中心 員工回簽頁（announce.html, static-ann-1.0.0）
  - 個人 token 連結（?t=...），token 即身分，免登入、不走 liff.init
  - 後端：Portal /exec  action=annPage / annConfirm（text/plain POST 免 CORS preflight）
  - 三語 zh/en/th，預設用後端回傳的對象語言，可手動切換
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans Thai",Roboto,sans-serif; background:#f0f4f8; color:#1a2433; min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:14px 14px 40px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; padding:10px 2px; }
  .brand { font-weight:800; color:#1451b8; font-size:15px; letter-spacing:.5px; }
  .langs button { border:1px solid #c9d6e8; background:#fff; border-radius:14px; padding:4px 12px; font-size:12px; margin-left:6px; color:#456; }
  .langs button.on { background:#1451b8; color:#fff; border-color:#1451b8; }
  .card { background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(20,50,110,.08); padding:18px 16px; margin-top:10px; }
  .title { font-size:17px; font-weight:800; line-height:1.45; }
  .meta { font-size:12px; color:#7688a0; margin-top:8px; line-height:1.6; }
  .meta .dl { color:#c0392b; font-weight:700; }
  .body { font-size:14.5px; line-height:1.75; margin-top:14px; white-space:pre-wrap; word-break:break-word; }
  .opts { margin-top:16px; }
  .opt { display:flex; gap:10px; align-items:flex-start; border:1.5px solid #d5dfec; border-radius:12px; padding:12px; margin-bottom:10px; cursor:pointer; min-height:44px; }
  .opt.sel { border-color:#1451b8; background:#eef4ff; }
  .opt input { margin-top:3px; width:18px; height:18px; }
  .opt .lbl { font-size:14.5px; line-height:1.5; }
  .btn { display:block; width:100%; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700; margin-top:16px; }
  .btn-primary { background:#1451b8; color:#fff; }
  .btn-primary:disabled { background:#b9c6da; }
  .state { border-radius:12px; padding:12px 14px; margin-top:14px; font-size:13.5px; line-height:1.6; }
  .state.ok { background:#e8f7ee; color:#186a3b; border:1px solid #bfe6cd; }
  .state.warn { background:#fff6e0; color:#8a6d00; border:1px solid #eedc9a; }
  .state.err { background:#fdecea; color:#b03a2e; border:1px solid #f5c6c0; }
  .stats { margin-top:14px; border-top:1px dashed #d5dfec; padding-top:12px; }
  .stats .row { display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0; }
  .loading { text-align:center; color:#7688a0; padding:60px 0; font-size:14px; }
  .foot { text-align:center; color:#a5b3c6; font-size:11px; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">AL-TRON 鋁創科技</div>
    <div class="langs">
      <button id="lang-zh" onclick="setLang('zh')">中</button>
      <button id="lang-en" onclick="setLang('en')">EN</button>
      <button id="lang-th" onclick="setLang('th')">ไทย</button>
    </div>
  </div>
  <div id="app"><div class="loading" id="loading">載入中… Loading… กำลังโหลด…</div></div>
  <div class="foot">AL-TRON Announce · static-ann-1.0.0</div>
</div>
<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycby5Yk0sPCZiYfKPmwfeSI7eyGI7SA4f5Ecduk_H3ZihwHn8k5jsvbL6_-IUf61MVREqeg/exec';
var TOKEN = new URLSearchParams(location.search).get('t') || '';
var LANG = 'zh';
var ANN = null, ME = null, STATS = null;
var SELECTED = {};

var I18N = {
  deadline:      { zh: '回覆期限', en: 'Deadline', th: 'กำหนดตอบ' },
  confirm:       { zh: '確認', en: 'Confirm', th: 'ยืนยัน' },
  confirmChange: { zh: '修改我的選擇', en: 'Change my choice', th: 'แก้ไขตัวเลือก' },
  needChoice:    { zh: '請先選擇後再按確認', en: 'Select an option first', th: 'กรุณาเลือกก่อนกดยืนยัน' },
  confirmedAt:   { zh: '你已於 {t} 確認', en: 'You confirmed at {t}', th: 'คุณยืนยันแล้วเมื่อ {t}' },
  yourChoice:    { zh: '你的選擇', en: 'Your choice', th: 'ตัวเลือกของคุณ' },
  changeable:    { zh: '期限內可修改選擇。', en: 'You may change your choice before the deadline.', th: 'แก้ไขได้ก่อนถึงกำหนด' },
  lateCanSign:   { zh: '已超過期限，仍可補簽（將記為逾期確認）。', en: 'Past deadline — you can still confirm (recorded as late).', th: 'เลยกำหนดแล้ว ยังยืนยันได้ (บันทึกเป็นการยืนยันล่าช้า)' },
  lateLocked:    { zh: '已超過期限，選擇已鎖定。', en: 'Past deadline — your response is locked.', th: 'เลยกำหนดแล้ว ไม่สามารถแก้ไขได้' },
  deadlinePassed:{ zh: '已超過期限，無法回覆。如需補登請聯絡管理員。', en: 'Deadline passed. Contact the administrator.', th: 'เลยกำหนดแล้ว กรุณาติดต่อผู้ดูแลระบบ' },
  closed:        { zh: '此公告已結案。', en: 'This announcement is closed.', th: 'ประกาศนี้ปิดแล้ว' },
  invalid:       { zh: '連結無效或已失效，請聯絡管理員。', en: 'Invalid link. Please contact the administrator.', th: 'ลิงก์ไม่ถูกต้อง กรุณาติดต่อผู้ดูแลระบบ' },
  netErr:        { zh: '連線失敗，請稍後再試。', en: 'Connection failed. Try again later.', th: 'การเชื่อมต่อล้มเหลว ลองใหม่อีกครั้ง' },
  saved:         { zh: '已完成確認 ✓', en: 'Confirmed ✓', th: 'ยืนยันเรียบร้อย ✓' },
  stats:         { zh: '統計結果（截止後公開）', en: 'Results (published after deadline)', th: 'ผลรวม (เปิดเผยหลังปิดรับ)' },
  people:        { zh: '人', en: '', th: 'คน' },
  readonly:      { zh: '（唯讀）', en: '(read-only)', th: '(อ่านอย่างเดียว)' },
  hello:         { zh: '', en: '', th: '' }
};
function T(k) { var r = I18N[k] || {}; return r[LANG] || r.zh || ''; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pick(zh, en, th) { return (LANG === 'en' ? (en || zh) : LANG === 'th' ? (th || zh) : (zh || en || th)) || ''; }

function api(action, body, cb, errCb) {
  fetch(GAS_URL + '?action=' + action, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); }).then(cb).catch(errCb || function() { showFatal(T('netErr')); });
}

function setLang(l) {
  LANG = l;
  ['zh', 'en', 'th'].forEach(function(x) {
    var b = document.getElementById('lang-' + x);
    if (b) b.className = x === l ? 'on' : '';
  });
  if (ANN) render();
}

function showFatal(msg) {
  document.getElementById('app').innerHTML = '<div class="card"><div class="state err">' + esc(msg) + '</div></div>';
}

function load() {
  if (!TOKEN) { showFatal(T('invalid')); return; }
  api('annPage', { token: TOKEN }, function(res) {
    if (res.error) { showFatal(res.error === 'voided' ? T('invalid') : T('invalid')); return; }
    ANN = res.ann; ME = res.me; STATS = res.stats || null;
    SELECTED = {};
    String(ME.choiceKeys || '').split(',').filter(Boolean).forEach(function(k) { SELECTED[k] = true; });
    setLang(ME.lang === 'en' || ME.lang === 'th' ? ME.lang : 'zh');
  });
}

function isLate() { return ANN.deadlineMs && Date.now() > ANN.deadlineMs; }
function isConfirmed() { return ME.status === 'confirmed' || ME.status === 'confirmed_late'; }

function render() {
  var app = document.getElementById('app');
  var title = pick(ANN.titleZh, ANN.titleEn, ANN.titleTh);
  var body = pick(ANN.bodyZh, ANN.bodyEn, ANN.bodyTh);
  var late = isLate(), confirmed = isConfirmed(), closed = ANN.status === 'closed';
  var canAct = !closed && (
    confirmed ? (!late && ANN.allowChange)
              : (!late || ANN.acceptLate)
  );

  var html = '<div class="card">';
  html += '<div class="title">' + esc(title) + '</div>';
  html += '<div class="meta">' + esc(ME.name) + ' · <span class="dl">' + T('deadline') + '：' + esc(ANN.deadline) + '</span>' + (closed || !canAct ? ' ' + T('readonly') : '') + '</div>';
  if (body) html += '<div class="body">' + esc(body) + '</div>';

  // 狀態列
  if (confirmed) {
    var optName = choiceNames();
    html += '<div class="state ok">' + T('confirmedAt').replace('{t}', ME.confirmedAt) + (optName ? '<br>' + T('yourChoice') + '：<strong>' + esc(optName) + '</strong>' : '') + '</div>';
    if (canAct) html += '<div class="state warn">' + T('changeable') + '</div>';
    else if (late && !closed) html += '<div class="state warn">' + T('lateLocked') + '</div>';
  } else if (closed) {
    html += '<div class="state err">' + T('closed') + '</div>';
  } else if (late) {
    html += '<div class="state ' + (ANN.acceptLate ? 'warn' : 'err') + '">' + (ANN.acceptLate ? T('lateCanSign') : T('deadlinePassed')) + '</div>';
  }

  // 選項
  if (ANN.type === 'choice' && (canAct || confirmed)) {
    html += '<div class="opts" id="opts">';
    (ANN.options || []).forEach(function(o) {
      var sel = !!SELECTED[o.key];
      html += '<label class="opt' + (sel ? ' sel' : '') + '" onclick="toggleOpt(event,\'' + esc(o.key) + '\')">' +
        '<input type="' + (ANN.multiSelect ? 'checkbox' : 'radio') + '" name="opt" value="' + esc(o.key) + '"' + (sel ? ' checked' : '') + (canAct ? '' : ' disabled') + '>' +
        '<span class="lbl">' + esc(pick(o.zh, o.en, o.th) || o.key) + '</span></label>';
    });
    html += '</div>';
  }

  // 確認鈕
  if (canAct) {
    html += '<button class="btn btn-primary" id="btn-confirm" onclick="doConfirm()">' + (confirmed ? T('confirmChange') : T('confirm')) + '</button>';
    html += '<div id="msg" style="text-align:center;font-size:13px;margin-top:10px;color:#b03a2e;"></div>';
  }

  // 公開統計
  if (STATS) {
    html += '<div class="stats"><div style="font-size:13px;font-weight:700;margin-bottom:6px;">' + T('stats') + '</div>';
    (ANN.options || []).forEach(function(o) {
      html += '<div class="row"><span>' + esc(pick(o.zh, o.en, o.th) || o.key) + '</span><strong>' + (STATS.counts[o.key] || 0) + ' ' + T('people') + '</strong></div>';
    });
    html += '</div>';
  }

  html += '</div>';
  app.innerHTML = html;
  updateBtn();
}

function choiceNames() {
  var names = [];
  (ANN.options || []).forEach(function(o) { if (SELECTED[o.key]) names.push(pick(o.zh, o.en, o.th) || o.key); });
  return names.join('、');
}

function toggleOpt(ev, key) {
  ev.preventDefault();
  var late = isLate(), confirmed = isConfirmed(), closed = ANN.status === 'closed';
  var canAct = !closed && (confirmed ? (!late && ANN.allowChange) : (!late || ANN.acceptLate));
  if (!canAct) return;
  if (ANN.multiSelect) SELECTED[key] = !SELECTED[key];
  else { SELECTED = {}; SELECTED[key] = true; }
  render();
}

function updateBtn() {
  var btn = document.getElementById('btn-confirm');
  if (!btn) return;
  if (ANN.type === 'choice') {
    var n = Object.keys(SELECTED).filter(function(k) { return SELECTED[k]; }).length;
    btn.disabled = n === 0;   // 必須先選擇才能確認（防「沒看就簽」）
  }
}

var SENDING = false;
function doConfirm() {
  if (SENDING) return;
  var choice = Object.keys(SELECTED).filter(function(k) { return SELECTED[k]; });
  if (ANN.type === 'choice' && !choice.length) {
    document.getElementById('msg').textContent = T('needChoice');
    return;
  }
  SENDING = true;
  var btn = document.getElementById('btn-confirm');
  btn.disabled = true; btn.textContent = '...';
  api('annConfirm', { token: TOKEN, choice: choice }, function(res) {
    SENDING = false;
    if (res.error) {
      var map = { closed: T('closed'), locked_after_deadline: T('lateLocked'), change_not_allowed: T('lateLocked'), deadline_passed: T('deadlinePassed'), bad_choice: T('needChoice') };
      if (res.me) ME = res.me;
      var el = document.getElementById('msg');
      if (el) el.textContent = map[res.error] || res.error;
      render();
      return;
    }
    ME = res.me; STATS = res.stats || STATS;
    SELECTED = {};
    String(ME.choiceKeys || '').split(',').filter(Boolean).forEach(function(k) { SELECTED[k] = true; });
    render();
    var okEl = document.createElement('div');
    okEl.className = 'state ok';
    okEl.textContent = T('saved');
  }, function() {
    SENDING = false;
    var el = document.getElementById('msg');
    if (el) el.textContent = T('netErr');
    updateBtn();
    var b = document.getElementById('btn-confirm');
    if (b) b.textContent = isConfirmed() ? T('confirmChange') : T('confirm');
  });
}

load();
</script>
</body>
</html>
