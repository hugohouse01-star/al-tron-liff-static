<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.line-scdn.net https://*.line-scdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.line-scdn.net; connect-src https://script.google.com https://script.googleusercontent.com https://*.line.me https://*.line-scdn.net https://*.line-apps.com; font-src 'self'; frame-src https://*.line.me https://*.line-scdn.net; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>鋁創 · 點餐</title>
<!--
  點餐系統 LINE 頁正式入口（meal-liff-3，M4 v0.5.0）。外殼：載 LINE 的 LIFF 程式 → boot.js（初始化、叫醒伺服器、問要載哪一版內容）→ app-<版號>.js（同仁頁）。
  規矩：外面來的字一律 textContent；不寫內嵌 script；瀏覽器裡不存身分資料（每個請求都帶 LINE 的身分憑證，伺服器不開 session）。
-->
<style>
  :root { --primary: #2563eb; --primary-light: #dbeafe; --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb; --gray-700: #374151; --radius: 12px; --text-sm: 13px; }
  html, body { margin: 0; background: #f7f8fa; color: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Noto Sans Thai", "Microsoft JhengHei", sans-serif; font-size: 15px; }
  [hidden] { display: none !important; }
  header.top { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--gray-200); padding: 10px 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  header.top #who { font-weight: 400; color: #6b7280; font-size: 13px; }
  main { padding: 10px 12px 96px; max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 12px; margin: 0 0 10px; }
  .card h3 { font-size: 15px; margin: 0 0 6px; }
  .muted { color: #6b7280; font-size: 13px; }
  .empty { text-align: center; color: #6b7280; padding: 32px 8px; }
  .hint { background: #eff6ff; border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 14px; }
  .hint.warn { background: #fef3c7; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
  .b { font-size: 15px; min-height: 40px; padding: 6px 12px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; color: #1f2937; }
  .b.p { background: var(--primary); border-color: var(--primary); color: #fff; }
  .b:disabled { opacity: .5; }
  .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; background: var(--gray-100); }
  .badge.on { background: #dcfce7; color: #166534; } .badge.off { background: var(--gray-100); color: #4b5563; }
  .mtabs { display: flex; gap: 4px; overflow-x: auto; margin: 0 0 8px; }
  .mtab { flex: none; border: 0; background: transparent; padding: 8px 12px; border-bottom: 2px solid transparent; font-size: 15px; min-height: 40px; }
  .mtab.on { border-bottom-color: var(--primary); color: var(--primary); font-weight: 600; }
  .su-top { padding: 10px 14px; } .su-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .su-bal.neg, .neg { color: #b91c1c; }
  .su-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--gray-200); }
  .su-sum { border-bottom: 0; }
  .su-cat { margin: 12px 0 4px; color: var(--gray-700); font-size: var(--text-sm); }
  .su-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--gray-100); }
  .su-th { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--gray-100); flex: none; }
  .su-nm { flex: 1; } .su-pr { min-width: 64px; text-align: right; }
  .su-cart { position: sticky; bottom: 0; z-index: 2; box-shadow: 0 -2px 8px rgba(0,0,0,.08); }
  .su-sheet { position: sticky; bottom: 0; z-index: 3; background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 12px; margin-top: 8px; box-shadow: 0 -4px 16px rgba(0,0,0,.12); }
  .su-sheet input[type=text], .card input[type=text] { width: 100%; box-sizing: border-box; margin: 6px 0; font-size: 16px; padding: 8px; border: 1px solid #d1d5db; border-radius: 8px; }
  .su-grp { margin: 6px 0; } .su-grp .b { margin: 2px 4px 2px 0; }
  .su-cand { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 0; border-bottom: 1px solid var(--gray-100); } .su-cand.mine { background: var(--primary-light); }
  .su-cand > .muted { grid-column: 1; } .su-cand > .b, .su-cand > .badge { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 20; background: #111827; color: #fff; border-radius: 10px; padding: 10px 12px; display: none; }
  #toast.err { background: #b91c1c; }
  #ask { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
  #ask .box { background: #fff; width: 100%; max-width: 640px; border-radius: 14px 14px 0 0; padding: 16px; }
  #askMsg { white-space: pre-wrap; margin: 8px 0 12px; line-height: 1.6; }
</style>
</head>
<body>
<header class="top"><span>🍱 鋁創 · 點餐</span><span id="who"></span></header>
<main><div id="status" class="muted">載入中…</div><div id="root"></div></main>
<div id="toast"></div>
<div id="ask" hidden><div class="box" role="dialog" aria-modal="true"><b id="askTitle"></b><div id="askMsg"></div><div class="bar"><button type="button" class="b" id="askNo">取消</button><button type="button" class="b p" id="askOk">確定</button></div></div></div>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="boot.js?b=3"></script>
</body>
</html>
